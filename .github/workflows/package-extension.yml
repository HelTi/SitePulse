name: Build offline extension package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension package
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/popup.html
          test -f dist/options.html
          test -f dist/_locales/zh_CN/messages.json
          test -f dist/_locales/en/messages.json

      - name: Upload offline package
        uses: actions/upload-artifact@v7
        with:
          name: sitepulse-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
