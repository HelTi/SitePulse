name: Build offline extension package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension package
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/popup.html
          test -f dist/options.html
          test -f dist/_locales/zh_CN/messages.json
          test -f dist/_locales/en/messages.json

      - name: Upload offline package
        uses: actions/upload-artifact@v7
        with:
          name: sitepulse-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./public/manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Release tag must use Chrome's numeric version format, for example v1.0.0."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" || "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag, manifest, and package versions must match."
            echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PACKAGE_VERSION"
            exit 1
          fi

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE_NAME="sitepulse-${RELEASE_TAG}.zip"
          (cd dist && zip -q -r "../${ARCHIVE_NAME}" .)
          test -s "$ARCHIVE_NAME"

      - name: Upload release ZIP for publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ github.ref_name }}
          path: sitepulse-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: release-package-${{ github.ref_name }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ASSET_PATH="release-assets/sitepulse-${RELEASE_TAG}.zip"
          test -s "$ASSET_PATH"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --verify-tag \
              --generate-notes \
              --title "SitePulse ${RELEASE_TAG}"
          fi
